<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test solo video</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}
video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.note{position:fixed;left:16px;bottom:16px;color:white;font:14px system-ui;background:rgba(0,0,0,.35);padding:8px 10px;border-radius:10px}
</style>
</head>
<body>
<video id="testVideo" autoplay muted loop playsinline controls></video>
<div class="note">Test solo video: se qui si vede, il file video è caricato correttamente.</div>
<script>
(() => {
  const video = document.getElementById("testVideo");
  const useMobileHero = window.matchMedia("(max-width: 900px)").matches;
  const source = document.createElement("source");

  video.poster = useMobileHero
    ? "hero-poster-mobile.png"
    : "hero-poster-desktop.png";
  source.src = useMobileHero
    ? "hero-video-mobile.mp4"
    : "hero-video-desktop.mp4";
  source.type = "video/mp4";
  video.appendChild(source);
})();
</script>
</body>
</html>
